# netlify.toml
# Tells Netlify where your project actually lives (birthday-letters-app is
# a subfolder of your repo), where the frontend files are, and where your
# serverless functions are. The functions themselves declare which URLs
# they handle (via `config.path` in each file), so no separate redirect
# rule is needed here.

[build]
  base = "birthday-letters-app"
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"
  included_files = ["db.js"]
